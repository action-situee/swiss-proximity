    <text x="119" y="160" fill="#ffffff" font-family="Arial, sans-serif" font-size="43" font-weight="700" text-anchor="middle">située</text>
  </g>
  <text x="376" y="190" fill="#111827" font-family="Arial, sans-serif" font-size="66" font-weight="700">Swiss Proximity</text>
  <text x="380" y="254" fill="#374151" font-family="Arial, sans-serif" font-size="34">Territoires des courtes distances</text>
  <text x="380" y="328" fill="#4b5563" font-family="Arial, sans-serif" font-size="25">Carte paramétrable des indicateurs de proximité</text>
  <text x="380" y="366" fill="#4b5563" font-family="Arial, sans-serif" font-size="25">pour les agglomérations transfrontalières suisses.</text>
  <g transform="translate(380 438)">
    <rect x="0" y="0" width="18" height="18" fill="#67a578"/>

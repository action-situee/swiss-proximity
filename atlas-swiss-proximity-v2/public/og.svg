    <text x="242" y="18" fill="#374151" font-family="Arial, sans-serif" font-size="20">mobilité quotidienne</text>
    <text x="482" y="18" fill="#374151" font-family="Arial, sans-serif" font-size="20">analyse territoriale</text>
  </g>
  <text x="70" y="566" fill="#67a578" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2">BUREAU ACTION SITUÉE</text>
